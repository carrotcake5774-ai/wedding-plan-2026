<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#ff6b8a" />
  <title>결혼 준비 — 잠금</title>
  <style>
    :root {
      --bg: #fff8f3; --ink: #25212a; --muted: #6f6576; --line: #ead8cf;
      --rose: #ff6b8a; --peach: #ffb37a; --blue: #5a8dee;
      --rose-text: #cf2e54; --blue-text: #2f5fc0;
      --settled: #3c9a6a; --settled-text: #23704a; --settled-soft: rgba(60,154,106,.12);
      --ongoing: #5a8dee; --ongoing-text: #2f5fc0; --ongoing-soft: rgba(90,141,238,.12);
      --todo: #f0a04b;    --todo-text: #9a560f;    --todo-soft: rgba(240,160,75,.16);
      --card: rgba(255,255,255,.86); --shadow: 0 24px 60px rgba(63,39,59,.13);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink); line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
      background: radial-gradient(circle at 12% 8%, rgba(255,107,138,.25), transparent 30%), radial-gradient(circle at 86% 12%, rgba(90,141,238,.20), transparent 32%), linear-gradient(135deg, #fff8f3 0%, #f8fbff 100%);
      background-color: var(--bg);
      background-attachment: fixed;
      padding: 40px 18px;
    }
    main { max-width: 1040px; margin: 0 auto; }
    a { color: var(--blue-text); text-underline-offset: 3px; }
    button { font: inherit; color: inherit; }

    /* ---- lock screen ---- */
    .panel { background: var(--card); border: 1px solid rgba(255,255,255,.74); border-radius: 26px; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .lock { max-width: 560px; margin: min(12vh,90px) auto 0; padding: 34px; }
    .lock h1 { margin: 0 0 10px; font-size: clamp(34px, 6vw, 58px); line-height: .98; letter-spacing: -0.05em; }
    .lock p { color: var(--muted); line-height: 1.65; }
    .form { display: flex; gap: 10px; margin-top: 22px; }
    .form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px; font: inherit; font-size: 17px; background: white; }
    .form button { border: 0; border-radius: 16px; padding: 15px 18px; font-weight: 900; color: white; background: linear-gradient(135deg, var(--rose), var(--peach)); cursor: pointer; }
    .form button[disabled] { opacity: .6; cursor: progress; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .error { color: #c2415b; font-weight: 800; min-height: 22px; margin-top: 12px; }

    /* ---- content ---- */
    .hero { display: grid; gap: 10px; margin-bottom: 18px; }
    .eyebrow { color: var(--rose-text); font-weight: 800; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 58px); line-height: 1.02; letter-spacing: -0.05em; }
    .subtitle { color: var(--muted); font-size: 17px; margin: 0; }
    h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.02em; }
    h3 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
    .muted { color: var(--muted); }
    .lede { color: var(--muted); margin: 4px 4px 14px; }

    .tabs {
      position: sticky; top: 8px; z-index: 5;
      display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px;
      padding: 6px; margin: 0 0 18px; border-radius: 20px;
      background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 10px 30px rgba(63,39,59,.10); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .tabs button { border: 0; background: transparent; border-radius: 14px; padding: 11px 6px; font-weight: 800; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tabs button.active { color: white; background: linear-gradient(135deg, var(--rose), var(--peach)); }
    .tabs button:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    .page { display: grid; gap: 16px; }

    /* countdown */
    .countdown { padding: 24px; text-align: center; }
    .cd-status { font-weight: 800; color: var(--rose-text); letter-spacing: .04em; }
    .cd-units { display: flex; justify-content: center; gap: clamp(10px, 4vw, 34px); margin: 8px 0 6px; }
    .cd-units div { display: grid; }
    .cd-units b { font-size: clamp(34px, 8vw, 56px); line-height: 1.05; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .cd-units span { color: var(--muted); font-size: 13px; font-weight: 700; }
    .cd-phase { color: var(--muted); }
    .cd-phase b { color: var(--ink); }
    .cd-list { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0; margin: 16px 0 0; }
    .cd-list li { display: flex; gap: 8px; align-items: baseline; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid var(--line); font-size: 14px; }
    .cd-list li b { font-variant-numeric: tabular-nums; }
    .cd-list li.next { border-color: var(--rose); color: var(--rose-text); }
    .cd-list li.done { opacity: .55; }

    /* events */
    .events { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .event { padding: 22px; position: relative; overflow: hidden; }
    .event::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; }
    .ev-banquet::before { background: linear-gradient(var(--rose), var(--peach)); }
    .ev-wedding::before { background: linear-gradient(var(--blue), #8a6df1); }
    .ev-tag { font-size: 13px; font-weight: 900; letter-spacing: .06em; color: var(--rose-text); }
    .ev-wedding .ev-tag { color: var(--blue-text); }
    .event h3 { margin: 8px 0 8px; font-size: 24px; line-height: 1.3; }
    .event h3 small { font-size: 17px; color: var(--muted); font-weight: 700; }
    .ev-venue { font-weight: 800; font-size: 17px; }
    .ev-addr { color: var(--muted); cursor: pointer; }
    .ev-access { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    .maplinks { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .maplinks a { text-decoration: none; font-weight: 800; font-size: 14px; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line); background: white; color: var(--ink); }
    [data-copy].copied { color: var(--settled-text); font-weight: 800; }

    /* family */
    .family { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 20px 22px; text-align: center; }
    .family div { display: grid; gap: 2px; }
    .family .role { font-size: 13px; color: var(--muted); font-weight: 700; }
    .family b { font-size: 22px; letter-spacing: -0.02em; }
    .family small { color: var(--muted); font-size: 14px; }
    .family .heart { color: var(--rose); font-size: 22px; }

    /* status */
    .status, .urgent { padding: 22px 24px; }
    .bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line); }
    .bar i { display: block; height: 100%; }
    .s-settled { background: var(--settled); } .s-ongoing { background: var(--ongoing); } .s-todo { background: var(--todo); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .legend button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: white; border-radius: 12px; padding: 9px 13px; font-weight: 700; cursor: pointer; }
    .legend button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .urgent ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .urgent button { width: 100%; display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: white; border-radius: 16px; padding: 12px 14px; cursor: pointer; }
    .urgent button b::before { content: "● "; color: var(--rose); }
    .urgent button span { color: var(--muted); font-size: 14px; }

    /* order */
    .order { padding: 22px 24px; }
    .order > .muted { margin: 0 0 12px; font-size: 14px; }
    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline li { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); position: relative; }
    .timeline li:first-child { border-top: 0; }
    .timeline time { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    .timeline time::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--settled); }
    .timeline li.st-wip time::before { background: var(--ongoing); }
    .timeline li.st-open time::before { background: var(--todo); }
    .tl-body { display: grid; }
    .tl-body b { font-size: 17px; }
    .tl-body span { color: var(--muted); font-size: 14px; }
    .tl-more { border: 1px solid var(--line); background: white; border-radius: 12px; padding: 8px 11px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .legend-note { color: var(--muted); font-size: 13px; margin: 0 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
    .dot.st-ok { background: var(--settled); } .dot.st-wip { background: var(--ongoing); } .dot.st-open { background: var(--todo); }

    /* issues */
    .issues { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .issue { padding: 20px 22px; display: grid; gap: 8px; align-content: start; scroll-margin-top: 90px; }
    .issue.is-urgent { border-color: rgba(255,107,138,.45); }
    .issue p { margin: 0; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: rgba(37,33,42,.06); color: var(--muted); }
    .chip.who { background: var(--ongoing-soft); color: var(--ongoing-text); }
    .chip.hot { background: rgba(255,107,138,.14); color: var(--rose-text); }
    .kv { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 8px; font-size: 15px; }
    .kv span { color: var(--muted); font-weight: 700; }
    .kv b { font-weight: 700; }
    .subopen { border-left: 3px solid var(--todo); padding: 4px 0 4px 12px; font-size: 14px; }
    .subopen ul { margin: 4px 0 0; padding-left: 18px; }
    .src { font-size: 12px; color: var(--muted); text-align: right; }

    /* settled */
    .settled-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .settled-group { padding: 20px 22px; }
    .settled-group h2 { color: var(--settled-text); font-size: 15px; letter-spacing: .04em; }
    .settled-group dl { margin: 0; }
    .settled-group .row { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .settled-group .row:first-child { border-top: 0; padding-top: 0; }
    .settled-group dt { color: var(--muted); font-weight: 700; }
    .settled-group dd { margin: 0; display: grid; gap: 2px; }
    .settled-group dd small { color: var(--muted); font-size: 13px; }
    .settled-group dd a { font-size: 14px; font-weight: 800; }

    /* details */
    .detail-head { margin: 10px 4px 0; }
    .detail { padding: 18px 22px; scroll-margin-top: 90px; border-left: 5px solid var(--settled); }
    .detail.st-wip { border-left-color: var(--ongoing); }
    .detail.st-open { border-left-color: var(--todo); }
    .detail.flash { animation: flash 1.4s ease-out; }
    @keyframes flash { from { box-shadow: 0 0 0 4px rgba(255,107,138,.55), var(--shadow); } to { box-shadow: var(--shadow); } }
    .detail header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
    .detail header time { font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
    .detail header span { color: var(--muted); font-size: 14px; }
    .detail ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .detail li { display: grid; grid-template-columns: 64px 120px minmax(0,1fr); gap: 10px; align-items: baseline; }
    .detail li > span:last-child { color: var(--muted); }
    .detail .muted { margin: 0; }
    .badge { font-size: 12px; font-weight: 900; text-align: center; padding: 3px 0; border-radius: 999px; }
    .b-ok { background: var(--settled-soft); color: var(--settled-text); }
    .b-wip { background: var(--ongoing-soft); color: var(--ongoing-text); }
    .b-open { background: var(--todo-soft); color: var(--todo-text); }

    footer { color: var(--muted); text-align: center; margin-top: 26px; font-size: 13px; }
    footer p { margin: 4px 0; }

    @media (max-width: 840px) {
      body { padding: 24px 16px; }
      .events, .issues, .settled-grid { grid-template-columns: 1fr; }
      .form { flex-direction: column; }
      .tabs { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .detail li { grid-template-columns: 64px minmax(0,1fr); }
      .detail li > span:last-child { grid-column: 2; }
      .family { grid-template-columns: 1fr; }
      .settled-group .row { grid-template-columns: 88px minmax(0,1fr); }
      .issue, .detail { scroll-margin-top: 150px; }
    }
    @media (prefers-reduced-motion: reduce) { .detail.flash { animation: none; } }
    @media print {
      body { background: white; padding: 0; }
      .tabs { display: none; }
      .page { display: grid !important; break-inside: avoid-page; }
      .panel { box-shadow: none; backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="panel lock">
      <div class="eyebrow">PRIVATE WEDDING PAGE</div>
      <h1>결혼 준비 문서</h1>
      <p>공유 링크는 열려 있지만, 내용은 비밀번호를 입력해야 복호화돼서 보여요.</p>
      <form class="form" id="unlockForm">
        <input id="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" autofocus />
        <button type="submit" id="unlockBtn">열기</button>
      </form>
      <div class="error" id="error" role="alert"></div>
      <div class="hint">※ 정적 페이지라 서버 인증은 아니지만, 내용은 암호화해 소스에 평문으로 두지 않았습니다.</div>
    </section>
  </main>

    const PW_KEY = 'weddingPagePassword';
    const dec = new TextDecoder();
    function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
    async function deriveKey(password) {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);

        { name: 'PBKDF2', salt: b64bytes(encrypted.salt), iterations: encrypted.iterations, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
    }
    async function reveal(password) {
      const key = await deriveKey(password);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64bytes(encrypted.iv) }, key, b64bytes(encrypted.data));
      document.getElementById('app').innerHTML = dec.decode(plain);
      const wrap = document.querySelector('[data-title]');
      document.title = wrap ? wrap.dataset.title : '결혼 준비';
      initPlan();
    }
    function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

        btn.disabled = false; btn.textContent = '열기';
        error.textContent = (window.crypto && window.crypto.subtle)
          ? '비밀번호가 맞지 않아요.'
          : '이 브라우저/환경에서는 복호화를 지원하지 않아요. (HTTPS에서 다시 시도)';
        const pw = document.getElementById('password');
        if (pw) { pw.focus(); pw.select(); }
      }
    });
    (async function trySaved() {
      const saved = ssGet(PW_KEY);
      if (!saved) return;
      try { await reveal(saved); } catch (e) { ssDel(PW_KEY); }
    })();

    /* ============ 문서 동작 (복호화 후 실행) ============ */
    function initPlan() {
      const $  = (s, r) => (r || document).querySelector(s);
      const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

      /* ---- tabs ---- */
      const TAB_KEY = 'weddingPageTab';
      const buttons = $$('[data-page-target]');
      const pages = $$('[data-page]');
      let current = null;
      function show(name, opts) {
        opts = opts || {};
        if (!pages.some(p => p.dataset.page === name)) name = 'overview';
        const changed = name !== current;
        current = name;
        pages.forEach(p => { p.style.display = p.dataset.page === name ? '' : 'none'; });
        buttons.forEach(b => {
          const on = b.dataset.pageTarget === name;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
          b.tabIndex = on ? 0 : -1;
          if (on && opts.focusTab) b.focus();
        });
        ssSet(TAB_KEY, name);
        if (opts.anchor) {
          const el = document.getElementById(opts.anchor);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
            return;
          }
        }
        if (changed && !opts.initial) window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      buttons.forEach((b, i) => {
        b.addEventListener('click', () => show(b.dataset.pageTarget));
        b.addEventListener('keydown', (e) => {
          let j = null;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % buttons.length;
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + buttons.length) % buttons.length;
          else if (e.key === 'Home') j = 0;
          else if (e.key === 'End') j = buttons.length - 1;
          if (j !== null) { e.preventDefault(); show(buttons[j].dataset.pageTarget, { focusTab: true }); }
        });
      });
      $$('[data-goto]').forEach(el => el.addEventListener('click', () => show(el.dataset.goto, { anchor: el.dataset.anchor })));
      show(ssGet(TAB_KEY) || 'overview', { initial: true });

      /* ---- countdown (Asia/Seoul 기준) ---- */
      const msEls = $$('[data-ms]');
      const ms = msEls.map(el => ({ el, t: new Date(el.dataset.ms).getTime(), key: el.dataset.key, label: el.dataset.label }));
      const seoulDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      const whenFmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' });
      function dayNum(t) { const [y, m, d] = seoulDate.format(t).split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
      const pad = n => String(n).padStart(2, '0');
      function setUnits(diff) {
        const s = Math.max(0, Math.floor(diff / 1000));
        $('#cdDays').textContent = Math.floor(s / 86400);
        $('#cdHours').textContent = pad(Math.floor((s % 86400) / 3600));
        $('#cdMins').textContent = pad(Math.floor((s % 3600) / 60));
        $('#cdSecs').textContent = pad(s % 60);
      }
      function tick() {
        if (!$('#cdStatus')) return;
        const now = Date.now();
        const today = dayNum(now);
        const next = ms.find(m => m.t > now);
        ms.forEach(m => {
          const d = dayNum(m.t) - today;
          m.el.querySelector('[data-dday]').textContent = d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
          m.el.classList.toggle('done', m.t <= now);
          m.el.classList.toggle('next', m === next);
        });
        if (next) {
          $('#cdStatus').textContent = next.label + '까지';
          setUnits(next.t - now);
          $('#cdPhase').innerHTML = '다음 · <b></b>';
          $('#cdPhase b').textContent = whenFmt.format(next.t);
        } else {
          const w = ms.find(m => m.key === 'wedding') || ms[0];
          $('#cdStatus').textContent = '결혼한 지';
          setUnits(now - w.t);
          $('#cdPhase').innerHTML = '💛 <b>우리 결혼했어요</b>';
        }
      }
      if (window.__wpTimer) clearInterval(window.__wpTimer);
      tick();
      window.__wpTimer = setInterval(tick, 1000);

      /* ---- 주소 복사 ---- */
      $$('[data-copy]').forEach(el => {
        el.setAttribute('title', '탭하면 복사');
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        const doCopy = async () => {
          if (el.__busy) return;
          const text = el.getAttribute('data-copy');
          let ok = false;
          try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
          if (!ok) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { ok = document.execCommand('copy'); } catch (e) {}
            ta.remove();
          }
          if (!ok) return;
          el.__busy = true;
          const old = el.textContent;
          el.textContent = '복사됨 ✓'; el.classList.add('copied');
          setTimeout(() => { el.textContent = old; el.classList.remove('copied'); el.__busy = false; }, 1100);
        };
        el.addEventListener('click', doCopy);
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); } });
      });
    }
  </script>
</body>
